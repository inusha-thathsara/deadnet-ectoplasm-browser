<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="ectoplasmGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#39ff14" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#10b981" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.7"/>
    </radialGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Background Plate with Emerald Glow Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#020617" stroke="#10b981" stroke-width="2.5" />

  <!-- Inner Subtle Cyber Scanline Grid -->
  <line x1="2" y1="32" x2="62" y2="32" stroke="#064e3b" stroke-width="0.8" stroke-dasharray="2,2"/>
  <line x1="32" y1="2" x2="32" y2="62" stroke="#064e3b" stroke-width="0.8" stroke-dasharray="2,2"/>

  <!-- Spectral Ghost Silhouette with Neon Ectoplasm Fill -->
  <path d="M32 14 C21 14 15 22 15 32 C15 42 17 49 19 49 C21 49 23 44 26 44 C28 44 30 49 32 49 C34 49 36 44 38 44 C41 44 43 49 45 49 C47 49 49 42 49 32 C49 22 43 14 32 14 Z" 
        fill="url(#ectoplasmGlow)" 
        filter="url(#neonBlur)" />

  <!-- Ghost Eyes (Dark Piercing Void with Lime Reflection) -->
  <ellipse cx="26" cy="28" rx="3.5" ry="4.5" fill="#020617" />
  <circle cx="27" cy="27" r="1.2" fill="#a7f3d0" />
  <ellipse cx="38" cy="28" rx="3.5" ry="4.5" fill="#020617" />
  <circle cx="39" cy="27" r="1.2" fill="#a7f3d0" />

  <!-- Floating Ectoplasm Particles -->
  <circle cx="14" cy="18" r="1.5" fill="#39ff14" opacity="0.9" />
  <circle cx="50" cy="20" r="1.8" fill="#39ff14" opacity="0.9" />
  <circle cx="48" cy="42" r="1.2" fill="#6ee7b7" opacity="0.8" />
  <circle cx="16" cy="40" r="1" fill="#6ee7b7" opacity="0.8" />
</svg>
