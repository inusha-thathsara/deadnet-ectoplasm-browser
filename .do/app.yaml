name: deadnet-ectoplasm-browser
region: nyc
services:
  - name: web
    github:
      branch: main
      deploy_on_push: true
    build_command: npm run build
    run_command: npm run start
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xs
    http_port: 3000
    health_check:
      http_path: /api/health
      initial_delay_seconds: 15
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: NODE_ENV
        value: production
      - key: OPENROUTER_API_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: BROWSERBASE_API_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: SERPAPI_API_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: ELEVENLABS_API_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: NEXT_PUBLIC_SENTRY_DSN
        scope: RUN_AND_BUILD_TIME
        type: SECRET

